name: Deploy Vue3 + Django Blog

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache Node dependencies
      uses: actions/cache@v3
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        cd backend && pip install -r requirements.txt
    
    - name: Install Node dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run Django tests
      env:
        SECRET_KEY: 'test-secret-key-for-ci'
        DEBUG: 'False'
        ALLOWED_HOSTS: 'localhost,127.0.0.1'
      run: |
        cd backend
        python manage.py collectstatic --noinput
        python manage.py migrate
        python manage.py test
    
    - name: Build Vue frontend
      run: |
        cd frontend
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-files
        path: |
          frontend/dist/
          backend/staticfiles/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-files
    
    - name: Deploy to production
      env:
        SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DEBUG: 'False'
        ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        echo "Deployment step - configure your deployment target here"
        echo "This could deploy to:"
        echo "- Heroku: git push heroku main"
        echo "- DigitalOcean App Platform"
        echo "- AWS Elastic Beanstalk"
        echo "- Google Cloud Run"
        echo "- Your own VPS with Docker"
        
        # Example for a VPS deployment with Docker:
        # docker build -t blog-app .
        # docker run -d -p 80:8000 blog-app